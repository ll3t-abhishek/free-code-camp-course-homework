<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>


        <link rel="icon" href="#">
        <link rel="stylesheet" href="styles.css">
        <script src="index.js" dref></script>
        
    </head>

    <body>
        <div class="calculator">

            <div class="header">

                <button class="hamburger-menu"><img class="img-icons " src="icons/burger-menu-svgrepo-com.svg"></button>
                <h3 id="standard">STANDARD</h3>
                <button class=" keep-on-top"><img class="img-icons" src="icons/back-to-top-svgrepo-com.svg"></button>
                <button class="history-icon"><img class="img-icons" src="icons/history-svgrepo-com.svg"></button>

            </div>

            <P id="calc-inv"></P>

            <h1 id="calc-result">0</h1>

            <div class="calc-buttons">
                <div><button class="c-btn" id="" onclick="calcf">%</button></div>
                <div><button class="c-btn" id="" onclick="calcf">CE</button></div>
                <div><button class="c-btn" id="" onclick="calcf">C</button></div>
                <div><button class="c-btn" id="" onclick="calcf">X</button></div>
                <div><button class="c-btn" id="" onclick="calcf">1/x</button></div>
                <div><button class="c-btn" id="" onclick="calcf">x^2</button></div>
                <div><button class="c-btn" id="" onclick="calcf">1/x^2</button></div>
                <div><button class="c-btn" id="" onclick="calcf">/</button></div>
                <div><button class="c-btn" id="c7" onclick="calcf7()">7</button></div>
                <div><button class="c-btn" id="c8" onclick="calcf8()">8</button></div>
                <div><button class="c-btn" id="" onclick="calcf">9</button></div>
                <div><button class="c-btn" id="c-m" onclick="calcfMult()">*</button></div>
                <div><button class="c-btn" id="" onclick="calcf">4</button></div>
                <div><button class="c-btn" id="" onclick="calcf">5</button></div>
                <div><button class="c-btn" id="" onclick="calcf">6</button></div>
                <div><button class="c-btn" id="" onclick="calcf">-</button></div>
                <div><button class="c-btn" id="" onclick="calcf">1</button></div>
                <div><button class="c-btn" id="" onclick="calcf">2</button></div>
                <div><button class="c-btn" id="" onclick="calcf">3</button></div>
                <div><button class="c-btn" id="c+" onclick="calcf">+</button></div>
                <div><button class="c-btn" id="" onclick="calcf">+/-</button></div>
                <div><button class="c-btn" id="" onclick="calcf">0</button></div>
                <div><button class="c-btn" id="" onclick="calcf">.</button></div>
                <div><button class="c-btn" id="#" onclick="calcfEqual()">=</button></div>
                

            </div>
        </div>

    </body>
</html>
