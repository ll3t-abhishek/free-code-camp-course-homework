<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>BlackJack</title>
        <link rel="stylesheet" href="styles.css">

        <script src="index.js" defer></script>

    </head>

        <div class="frame">
            <h1>BLACKJACK</h1>
