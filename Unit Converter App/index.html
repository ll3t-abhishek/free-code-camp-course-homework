<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Unit Conversion Calc</title>
    <link rel="icon" href="fav-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">  
    <script src="index.js" defer></script>    
  </head>
  
  <body>
    <header>
      <h2>Metric/Imperial Unit Conversion</h2>
      <input id="input-el" type="text" placeholder="0">
      <button id="button-el">Convert</button>
    </header>
    <section class="body-el">
      <div class="body-length-el">
        <h3>Length (Meter/Feet)</h3>
          <p>
            <span class="input-value">0 </span>meters = 
            <span id="meterToFeet">0 </span>feet | 
            <span class="input-value">0 </span>feet = 
            <span>0 </span>meters
          </p>
      </div>
      <div class="body-volume-el">
        <h3>Volume (Liters/Gallons)</h3>
          <p>
            <span class="input-value">0 </span>liters = 
            <span>0 </span>gallons | 
            <span class="input-value">0 </span>gallons = 
            <span>0 </span>liters
          </p>
      </div>
      <div class="body-mass-el">
        <h3>Mass (Kilograms/Pounds)</h3>
          <p>
            <span class="input-value">0 </span>kilos = 
            <span>0 </span>pounds | 
            <span class="input-value">0 </span>pounds = 
            <span>0 </span>kilos
          </p>
      </div>
      

    </section>

  </body>
</html>
